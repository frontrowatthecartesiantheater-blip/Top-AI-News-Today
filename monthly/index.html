  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808;
      --border: #1e1e1e;
      --text: #f0f0f0;
      --muted: #999;
      --mono: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
    }
    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 90% 80% at 50% 30%, transparent 40%, var(--bg) 100%);
      pointer-events: none;
      z-index: 0;
    }
    nav {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 24px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; letter-spacing: 0.06em; }
    .logo span { color: var(--text); }
    nav a.back { font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 0.08em; }
    nav a.back:hover { color: var(--text); }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }
    .eyebrow { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); margin-bottom: 48px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    footer p { font-size: 11px; color: #555; letter-spacing: 0.04em; }
    footer a { color: #666; text-decoration: none; }
    footer a:hover { color: var(--muted); }
  </style>
</head>
